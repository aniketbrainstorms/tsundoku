<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f2ede6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" type="image/png" href="fav_icon_640.png">
  <link rel="apple-touch-icon" href="fav_icon_640.png">
  <title>tsundoku</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600&family=Noto+Serif+JP:wght@400;500&display=swap" rel="stylesheet">

  <style>
    /* ── Tokens ──────────────────────────────────────── */
    :root {
      --bg:           #f2ede6;
      --text:         #1e1b18;
      --text-dim:     #5c5750;
      --text-muted:   #9a9189;
      --border:       #ddd8cf;
      --cta-bg:       #2e2b27;
      --cta-text:     #f2ede6;
      --font-jp:      'Noto Serif JP', 'YuMincho', 'Hiragino Mincho ProN', serif;
      --font-sans:    'DM Sans', -apple-system, sans-serif;
      --ease-out:     cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* ── Reset ───────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { height: 100%; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      font-family: var(--font-sans);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* ── Page shell ──────────────────────────────────── */
    .page {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding-bottom: max(env(safe-area-inset-bottom), 20px);
    }

    /* ── Title block ─────────────────────────────────── */
    .title-block {
      padding: clamp(52px, 10vw, 72px) 24px clamp(20px, 4vw, 32px);
      text-align: center;
      opacity: 0;
      transform: translateY(-14px);
      animation: riseIn 0.75s var(--ease-out) 0.1s forwards;
    }

    .kanji {
      font-family: var(--font-jp);
      font-size: clamp(40px, 10vw, 58px);
      font-weight: 500;
      color: var(--text);
      letter-spacing: 0.08em;
      line-height: 1.1;
      display: block;
      margin-bottom: 6px;
    }

    .romaji {
      font-family: var(--font-sans);
      font-size: clamp(13px, 3.2vw, 16px);
      font-weight: 300;
      color: var(--text);
      letter-spacing: 0.36em;
      text-indent: 0.36em;
      display: block;
    }

    /* ── Hero ────────────────────────────────────────── */
    .hero {
      width: 100%;
      position: relative;
      /* No max-height — let the image dictate its natural height
         so books + cat are never cropped */
      opacity: 0;
      animation: fadeIn 0.9s ease 0.28s forwards;
      background: #f0ebe3; /* matches photo's white wall tone */
    }

    .hero img {
      width: 100%;
      display: block;
      /* contain so the full landscape photo shows edge-to-edge
         without cropping the books at bottom or cat at top */
      object-fit: contain;
      filter: saturate(0.88) brightness(1.02) sepia(0.04);
    }

    /* Bottom fade — photo bleeds into bg seamlessly */
    .hero::after {
      content: '';
      position: absolute;
      inset: auto 0 0 0;
      height: 72px;
      background: linear-gradient(to bottom, transparent, var(--bg));
      pointer-events: none;
    }

    /* ── Body ────────────────────────────────────────── */
    .body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 28px;
      gap: 0;
      opacity: 0;
      transform: translateY(20px);
      animation: riseIn 0.85s var(--ease-out) 0.48s forwards;
    }

    /* ── Definition ──────────────────────────────────── */
    .definition {
      text-align: center;
      padding: clamp(22px, 5vw, 36px) 0 clamp(20px, 4vw, 28px);
    }

    .definition p {
      font-size: clamp(12.5px, 3.2vw, 14.5px);
      font-weight: 300;
      line-height: 1.95;
      color: var(--text-dim);
      /*
        The mockup uses a fixed-width monospace-ish feel for
        this text. We replicate with letter-spacing + tabular
        numerals — no actual monospace font needed.
      */
      letter-spacing: 0.025em;
      font-variant-numeric: tabular-nums;
    }

    /* ── Divider ──────────────────────────────────────── */
    .divider {
      width: 44px;
      height: 1px;
      background: var(--border);
      margin: 0 auto clamp(20px, 4vw, 32px);
      flex-shrink: 0;
    }

    /* ── Features ────────────────────────────────────── */
    .features {
      display: flex;
      align-items: stretch;
      justify-content: center;
      width: 100%;
      max-width: 360px;
      margin-bottom: clamp(24px, 5vw, 40px);
    }

    .feature {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 0 6px;
    }

    .feature-sep {
      width: 1px;
      background: var(--border);
      align-self: stretch;
      flex-shrink: 0;
      margin: 4px 0;
    }

    .feat-icon {
      color: var(--text);
      opacity: 0.8;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 34px;
    }

    .feat-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.01em;
      line-height: 1;
    }

    .feat-sub {
      font-size: 11px;
      font-weight: 300;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.45;
    }

    /* ── CTA ─────────────────────────────────────────── */
    .cta-wrap {
      width: 100%;
      max-width: 380px;
      margin-bottom: clamp(16px, 3.5vw, 24px);
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 56px;
      padding: 0 8px 0 26px;
      border-radius: 14px;
      background: var(--cta-bg);
      color: var(--cta-text);
      border: none;
      font-family: var(--font-sans);
      font-size: 16px;
      font-weight: 400;
      letter-spacing: 0.02em;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition:
        background 0.22s ease,
        transform  0.2s var(--ease-out),
        box-shadow 0.22s ease;
      /* Subtle inner highlight — makes it feel physical */
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.06),
        0 4px 18px rgba(30,27,24,0.14);
    }

    .btn:hover {
      background: #3d3935;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.07),
        0 6px 24px rgba(30,27,24,0.20);
    }

    .btn:active {
      transform: scale(0.982);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.04),
        0 2px 8px rgba(30,27,24,0.10);
    }

    .btn-label {
      position: relative;
      top: 0;
    }

    .btn-arrow {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.28s var(--ease-out), background 0.22s ease;
    }

    .btn:hover .btn-arrow {
      transform: translateX(3px);
      background: rgba(255,255,255,0.12);
    }

    /* ── Footer ──────────────────────────────────────── */
    .footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-top: auto;
      padding-bottom: 4px;
    }

    .tagline {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 300;
      color: var(--text-muted);
      letter-spacing: 0.03em;
    }

    .tagline svg {
      flex-shrink: 0;
      opacity: 0.55;
    }

    .dots {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--border);
      transition: background 0.3s ease, width 0.35s var(--ease-out), border-radius 0.35s var(--ease-out);
      cursor: pointer;
    }

    .dot.active {
      background: var(--text);
      width: 20px;
      border-radius: 4px;
    }

    /* iOS home bar */
    .home-bar {
      width: 34%;
      height: 5px;
      background: var(--text);
      border-radius: 3px;
      opacity: 0.15;
      margin: 14px auto 0;
      flex-shrink: 0;
    }

    /* ── Keyframes ───────────────────────────────────── */
    @keyframes riseIn {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    /* ── Reduced motion ──────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      .title-block, .hero, .body {
        animation: none;
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>
<body>

<main class="page">

  <!-- ① Title -->
  <div class="title-block">
    <span class="kanji">積ん読</span>
    <span class="romaji">tsundoku</span>
  </div>

  <!-- ② Hero photo -->
  <div class="hero">
    <img
      src="hero_books.png"
      alt="Stacks of old books with a cat sleeping on top, warm afternoon light"
      width="960"
      height="640"
      decoding="async"
    >
  </div>

  <!-- ③ Body -->
  <div class="body">

    <div class="definition">
      <p>
        the act of buying books<br>
        and letting them pile up, unread.<br>
        not a bad habit. a lifestyle.
      </p>
    </div>

    <div class="divider"></div>

    <!-- Features -->
    <div class="features">

      <div class="feature">
        <div class="feat-icon">
          <!-- Three books / collect -->
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3"  y="5"  width="4" height="14" rx="0.75"/>
            <rect x="9"  y="3"  width="4" height="16" rx="0.75"/>
            <rect x="15" y="7"  width="4" height="12" rx="0.75"/>
          </svg>
        </div>
        <span class="feat-label">collect</span>
        <span class="feat-sub">books you'll love</span>
      </div>

      <div class="feature-sep"></div>

      <div class="feature">
        <div class="feat-icon">
          <!-- Bookmark / organize -->
          <svg width="26" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
          </svg>
        </div>
        <span class="feat-label">organize</span>
        <span class="feat-sub">your growing stack</span>
      </div>

      <div class="feature-sep"></div>

      <div class="feature">
        <div class="feat-icon">
          <!-- Open book / read -->
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
        </div>
        <span class="feat-label">read</span>
        <span class="feat-sub">at your own pace</span>
      </div>

    </div>

    <!-- CTA -->
    <div class="cta-wrap">
      <button class="btn" id="ctaBtn" aria-label="Get started with Tsundoku">
        <span class="btn-label">get started</span>
        <span class="btn-arrow" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </span>
      </button>
    </div>

    <!-- Footer -->
    <div class="footer">
      <div class="tagline" aria-label="every book has its time.">
        <!-- leaf / sprig icon -->
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 22V12"/>
          <path d="M5 12C5 7 8.5 4 12 4c3.5 0 7 3 7 8-2 0-4.5-.5-7-3C9.5 11.5 7 12 5 12z"/>
        </svg>
        <span>every book has its time.</span>
      </div>

      <div class="dots" role="tablist" aria-label="onboarding page indicator">
        <div class="dot active" role="tab" aria-selected="true"  aria-label="page 1"></div>
        <div class="dot"        role="tab" aria-selected="false" aria-label="page 2"></div>
        <div class="dot"        role="tab" aria-selected="false" aria-label="page 3"></div>
      </div>
    </div>

  </div><!-- /body -->

</main>

<!-- iOS home indicator -->
<div class="home-bar" aria-hidden="true"></div>

<script>
  /* ── CTA → app ──────────────────────────────────── */
  document.getElementById('ctaBtn').addEventListener('click', () => {
    document.body.style.transition = 'opacity 0.35s ease';
    document.body.style.opacity = '0';
    setTimeout(() => { window.location.href = 'index.html'; }, 350);
  });

  /* ── Dot clicks ──────────────────────────────────── */
  document.querySelectorAll('.dot').forEach((dot, i, all) => {
    dot.addEventListener('click', () => {
      all.forEach(d => { d.classList.remove('active'); d.setAttribute('aria-selected','false'); });
      dot.classList.add('active');
      dot.setAttribute('aria-selected','true');
    });
  });
</script>

</body>
</html>
