<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FDF2E7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" type="image/png" href="fav_icon_640.png">
  <link rel="apple-touch-icon" href="fav_icon_640.png">
  <title>tsundoku</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600&display=swap" rel="stylesheet">

  <style>
    @font-face {
      font-family: 'Bristol';
      src: url('Bristol.woff') format('woff'),
           url('Bristol.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    /* ── Tokens ──────────────────────────────────────── */
    :root {
      --bg:           #FDF2E7;
      --text:         #1a1714;
      --text-dim:     #5c5750;
      --text-muted:   #9a9189;
      --border:       #ddd8cf;
      --red:          #c8181a;
      --red-dark:     #a21215;
      --font-sans:    'DM Sans', -apple-system, sans-serif;
      --font-bristol: 'Bristol', cursive;
      --ease-spring:  cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* ── Reset ───────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }

    body {
      height: 100vh;
      height: 100dvh;
      background: var(--bg);
      font-family: var(--font-sans);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }

    /* ── Page shell ──────────────────────────────────── */
    .page {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
      /* safe area */
      padding-top: max(env(safe-area-inset-top), 0px);
      padding-bottom: max(env(safe-area-inset-bottom), 20px);
    }

    /* ── Hero image — absolute background layer ──────── */
    .hero-bg {
      position: absolute;
      /* start below the title block — roughly 160px from top */
      top: max(calc(env(safe-area-inset-top) + 148px), 148px);
      left: 0;
      width: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .hero-bg img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* ── Everything above image ───────────────────────── */
    .title-block,
    .bottom {
      position: relative;
      z-index: 1;
    }

    /* ── Title block ─────────────────────────────────── */
    .title-block {
      padding: clamp(20px, 5vw, 36px) 24px 0;
      text-align: center;
      opacity: 0;
      transform: translateY(-12px);
      animation: riseIn 0.7s var(--ease-spring) 0.05s forwards;
      flex-shrink: 0;
    }

    .wordmark {
      font-family: var(--font-bristol);
      font-size: clamp(38px, 10vw, 56px);
      font-weight: 400;
      letter-spacing: 0.01em;
      color: var(--text);
      display: block;
      margin-bottom: 2px;
    }

    .byline {
      font-family: var(--font-bristol);
      font-size: clamp(13px, 3.5vw, 17px);
      font-weight: 400;
      color: var(--text-dim);
      letter-spacing: 0.02em;
      display: block;
      margin-bottom: 10px;
    }

    .definition-top {
      font-family: var(--font-sans);
      font-size: clamp(9px, 2.5vw, 11px);
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--red);
      line-height: 1.85;
    }

    /* ── Spacer pushes bottom to the end ─────────────── */
    .spacer { flex: 1; }

    /* ── Bottom section ──────────────────────────────── */
    .bottom {
      padding: 0 24px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      opacity: 0;
      transform: translateY(18px);
      animation: riseIn 0.8s var(--ease-spring) 0.4s forwards;
    }

    /* ── Features ────────────────────────────────────── */
    .features {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      width: 100%;
      max-width: 360px;
      margin-bottom: clamp(14px, 3vw, 20px);
      padding-top: 8px;
    }

    .feature {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .feature-sep {
      width: 1px;
      background: var(--border);
      align-self: stretch;
      flex-shrink: 0;
      margin: 6px 0;
    }

    .feat-icon {
      color: var(--text);
      opacity: 0.75;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 30px;
    }

    .feat-label {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--red);
      letter-spacing: 0.01em;
      line-height: 1;
    }

    .feat-sub {
      font-size: 11px;
      font-weight: 300;
      color: var(--text-dim);
      text-align: center;
      line-height: 1.45;
    }

    /* ── CTA ─────────────────────────────────────────── */
    .cta-wrap {
      width: 100%;
      max-width: 380px;
      padding: 0 4px;
      margin-bottom: clamp(10px, 2vw, 16px);
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 58px;
      padding: 0 8px 0 28px;
      border-radius: 999px;
      background: var(--red);
      color: #fff;
      border: none;
      font-family: var(--font-sans);
      font-size: 15px;
      font-weight: 400;
      letter-spacing: 0.025em;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition:
        background 0.2s ease,
        transform  0.18s var(--ease-spring),
        box-shadow 0.2s ease;
      box-shadow: 0 6px 24px rgba(200, 24, 26, 0.32);
    }

    .btn:hover  { background: var(--red-dark); }
    .btn:active { transform: scale(0.978); }

    .btn-arrow {
      width: 42px;
      height: 42px;
      border-radius: 999px;
      background: rgba(255,255,255,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.26s var(--ease-spring);
    }

    .btn:hover .btn-arrow { transform: translateX(3px); }

    /* ── Footer ──────────────────────────────────────── */
    .footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .quote-carousel {
      width: 100%;
      max-width: 320px;
      overflow: hidden;
    }

    .quote-track {
      display: flex;
      transition: transform 0.38s var(--ease-spring);
      will-change: transform;
    }

    .quote-slide {
      flex: 0 0 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 300;
      color: var(--text-muted);
      letter-spacing: 0.03em;
      user-select: none;
      -webkit-user-select: none;
    }

    .quote-slide svg { flex-shrink: 0; opacity: 0.5; }

    .dots {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--border);
      transition: background 0.3s ease, width 0.35s var(--ease-spring), border-radius 0.35s var(--ease-spring);
      cursor: pointer;
    }

    .dot.active {
      background: var(--red);
      width: 22px;
      border-radius: 4px;
    }

    /* ── Keyframes ───────────────────────────────────── */
    @keyframes riseIn {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .title-block, .hero-bg, .bottom {
        animation: none;
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>
<body>

<main class="page">

  <!-- Hero image sits behind everything -->
  <div class="hero-bg" aria-hidden="true">
    <img
      src="hero_welcome.png"
      alt=""
      decoding="async"
    >
  </div>

  <!-- ① Title — z-index:1, above image -->
  <div class="title-block">
    <span class="wordmark">Tsundoku</span>
    <span class="byline">by aniket</span>
    <p class="definition-top">
      the act of buying books<br>
      and letting them pile up, unread.<br>
      not a bad habit. a lifestyle.
    </p>
  </div>

  <!-- Spacer pushes bottom UI to the screen floor -->
  <div class="spacer"></div>

  <!-- ② Bottom — z-index:1, above image -->
  <div class="bottom">

    <div class="features">
      <div class="feature">
        <div class="feat-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3"  y="5"  width="4" height="14" rx="0.75"/>
            <rect x="9"  y="3"  width="4" height="16" rx="0.75"/>
            <rect x="15" y="7"  width="4" height="12" rx="0.75"/>
          </svg>
        </div>
        <span class="feat-label">collect</span>
        <span class="feat-sub">books you'll love</span>
      </div>

      <div class="feature-sep"></div>

      <div class="feature">
        <div class="feat-icon">
          <svg width="24" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
          </svg>
        </div>
        <span class="feat-label">organize</span>
        <span class="feat-sub">your growing stack</span>
      </div>

      <div class="feature-sep"></div>

      <div class="feature">
        <div class="feat-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
        </div>
        <span class="feat-label">read</span>
        <span class="feat-sub">at your own pace</span>
      </div>
    </div>

    <div class="cta-wrap">
      <button class="btn" id="ctaBtn" aria-label="Get started with Tsundoku">
        <span class="btn-label">get started</span>
        <span class="btn-arrow" aria-hidden="true">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </span>
      </button>
    </div>

    <div class="footer">
      <div class="quote-carousel" id="quoteCarousel" aria-live="polite">
        <div class="quote-track" id="quoteTrack">
          <div class="quote-slide">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22V12"/><path d="M5 12C5 7 8.5 4 12 4c3.5 0 7 3 7 8-2 0-4.5-.5-7-3C9.5 11.5 7 12 5 12z"/></svg>
            <span>curiosity looks good in stacks.</span>
          </div>
          <div class="quote-slide">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22V12"/><path d="M5 12C5 7 8.5 4 12 4c3.5 0 7 3 7 8-2 0-4.5-.5-7-3C9.5 11.5 7 12 5 12z"/></svg>
            <span>not yet is not never.</span>
          </div>
          <div class="quote-slide">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22V12"/><path d="M5 12C5 7 8.5 4 12 4c3.5 0 7 3 7 8-2 0-4.5-.5-7-3C9.5 11.5 7 12 5 12z"/></svg>
            <span>bought by impulse, read by destiny.</span>
          </div>
        </div>
      </div>

      <div class="dots" role="tablist" aria-label="onboarding page indicator">
        <div class="dot active" role="tab" data-index="0" aria-selected="true"  aria-label="page 1"></div>
        <div class="dot"        role="tab" data-index="1" aria-selected="false" aria-label="page 2"></div>
        <div class="dot"        role="tab" data-index="2" aria-selected="false" aria-label="page 3"></div>
      </div>
    </div>

  </div><!-- /bottom -->

</main>

<script>
  document.getElementById('ctaBtn').addEventListener('click', () => {
    document.body.style.transition = 'opacity 0.32s ease';
    document.body.style.opacity = '0';
    setTimeout(() => { window.location.href = 'app.html'; }, 320);
  });

  (() => {
    const track = document.getElementById('quoteTrack');
    const dots  = document.querySelectorAll('.dot');
    let current = 0, startX = 0, dragging = false;

    function goTo(idx) {
      current = ((idx % 3) + 3) % 3;
      track.style.transform = `translateX(-${current * 100}%)`;
      dots.forEach((d, i) => {
        d.classList.toggle('active', i === current);
        d.setAttribute('aria-selected', i === current ? 'true' : 'false');
      });
    }

    dots.forEach(d => d.addEventListener('click', () => goTo(+d.dataset.index)));

    const c = document.getElementById('quoteCarousel');
    c.addEventListener('touchstart', e => { startX = e.touches[0].clientX; dragging = true; }, { passive: true });
    c.addEventListener('touchend',   e => {
      if (!dragging) return; dragging = false;
      const dx = e.changedTouches[0].clientX - startX;
      if (Math.abs(dx) > 30) goTo(current + (dx < 0 ? 1 : -1));
    });
    c.addEventListener('mousedown',  e => { startX = e.clientX; dragging = true; });
    c.addEventListener('mouseup',    e => {
      if (!dragging) return; dragging = false;
      const dx = e.clientX - startX;
      if (Math.abs(dx) > 30) goTo(current + (dx < 0 ? 1 : -1));
    });
    c.addEventListener('mouseleave', () => { dragging = false; });

    setInterval(() => goTo(current + 1), 4000);
  })();
</script>

</body>
</html>
