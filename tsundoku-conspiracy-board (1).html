<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>tsundoku — evidence wall</title>
<style>
  :root{
    --bg:#F7F4EF;
    --board:#EFE8DD;
    --board-2:#E6DDCC;
    --paper:#FCFBF7;
    --paper-read:#EDE3C8;
    --paper-reading:#F4E9D6;
    --wood:#8A725A;
    --wood-dark:#6E5A46;
    --thread:#C9B39A;
    --thread-fav:#A35A4C;
    --text:#3F3A36;
    --text-soft:#8A8077;
    --accent:#A35A4C;
    --pin:#8B3A2E;
    --pin-shine:#D98C78;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;width:100%;height:100%;
    background:var(--bg);
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,'DM Sans',system-ui,sans-serif;
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    touch-action:none;
    overscroll-behavior:none;
  }

  /* ---------- top chrome ---------- */
  .topbar{
    position:fixed;top:0;left:0;right:0;
    height:64px;
    display:flex;align-items:center;gap:14px;
    padding:0 20px;
    z-index:50;
    pointer-events:none;
  }
  .topbar > *{pointer-events:auto;}
  .brand{
    font-family:'Bristol','Cormorant Garamond',serif;
    font-size:21px;letter-spacing:.5px;
    color:var(--text);
    text-transform:lowercase;
    user-select:none;
  }
  .search-wrap{
    flex:1;max-width:360px;
    position:relative;
  }
  .search-input{
    width:100%;
    background:rgba(252,251,247,.85);
    backdrop-filter:blur(8px);
    border:1px solid rgba(63,58,54,.12);
    border-radius:999px;
    padding:9px 16px 9px 36px;
    font-size:13.5px;
    color:var(--text);
    outline:none;
    box-shadow:0 2px 10px rgba(63,58,54,.06);
    transition:box-shadow .2s ease, border-color .2s ease;
  }
  .search-input::placeholder{color:var(--text-soft);}
  .search-input:focus{border-color:rgba(163,90,76,.4);box-shadow:0 4px 16px rgba(163,90,76,.12);}
  .search-icon{
    position:absolute;left:13px;top:50%;transform:translateY(-50%);
    width:14px;height:14px;opacity:.45;pointer-events:none;
  }
  .topbar-right{
    display:flex;align-items:center;gap:8px;
    margin-left:auto;
  }
  .chip-btn{
    background:rgba(252,251,247,.85);
    backdrop-filter:blur(8px);
    border:1px solid rgba(63,58,54,.12);
    border-radius:999px;
    padding:8px 14px;
    font-size:12.5px;
    color:var(--text);
    cursor:pointer;
    box-shadow:0 2px 10px rgba(63,58,54,.06);
    user-select:none;
    transition:transform .15s ease, box-shadow .15s ease;
    display:flex;align-items:center;gap:6px;
  }
  .chip-btn:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(63,58,54,.1);}
  .chip-btn:active{transform:translateY(0);}
  .chip-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}

  /* ---------- canvas / world ---------- */
  #stage{
    position:fixed;inset:0;
    cursor:grab;
  }
  #stage.dragging{cursor:grabbing;}
  #threadCanvas{
    position:absolute;top:0;left:0;
    pointer-events:none;
    image-rendering:auto;
  }
  #world{
    position:absolute;top:0;left:0;
    transform-origin:0 0;
    will-change:transform;
  }

  /* board texture sits behind everything, scrolls with world */
  .board-bg{
    position:absolute;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.18), transparent 60%),
      repeating-linear-gradient(95deg, rgba(0,0,0,.025) 0 2px, transparent 2px 7px),
      linear-gradient(180deg, var(--board) 0%, var(--board-2) 100%);
    border-radius:18px;
    box-shadow:
      0 30px 80px rgba(63,46,30,.18),
      0 4px 14px rgba(63,46,30,.12),
      inset 0 0 0 1px rgba(255,255,255,.25);
  }

  /* ---------- author node (polaroid) ---------- */
  .author-node{
    position:absolute;
    width:148px;
    will-change:transform;
    transition:opacity .35s ease, filter .35s ease;
    cursor:pointer;
    z-index:5;
  }
  .author-node.dimmed{opacity:.16;filter:saturate(.5);}
  .author-node.focused{z-index:30;}

  .polaroid{
    background:var(--paper);
    border-radius:3px;
    padding:8px 8px 14px;
    box-shadow:
      0 1px 1px rgba(63,46,30,.08),
      0 8px 18px rgba(63,46,30,.16),
      0 2px 4px rgba(63,46,30,.1);
    transform:rotate(var(--rot,0deg));
    transition:transform .25s cubic-bezier(.2,.9,.3,1.3), box-shadow .25s ease;
    position:relative;
  }
  .author-node:hover .polaroid,
  .author-node.focused .polaroid{
    transform:rotate(0deg) scale(1.06);
    box-shadow:
      0 1px 1px rgba(63,46,30,.1),
      0 16px 34px rgba(63,46,30,.24),
      0 4px 8px rgba(63,46,30,.12);
  }

  .portrait-wrap{
    width:100%;aspect-ratio:1/1;
    border-radius:2px;
    overflow:hidden;
    background:#ddd5c8;
    position:relative;
  }
  .portrait-wrap img{
    width:100%;height:100%;object-fit:cover;
    filter:grayscale(.55) contrast(1.04) brightness(1.01) sepia(.06);
    display:block;
  }
  .portrait-wrap::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(160deg, rgba(255,255,255,.15), transparent 40%, rgba(0,0,0,.06));
    pointer-events:none;
  }

  .author-meta{
    text-align:center;
    padding-top:9px;
  }
  .author-name{
    font-size:12.5px;font-weight:600;
    line-height:1.25;
    color:var(--text);
    font-family:'Cormorant Garamond', Georgia, serif;
    letter-spacing:.2px;
  }
  .author-count{
    font-size:9.5px;
    color:var(--text-soft);
    margin-top:2px;
    letter-spacing:.3px;
  }

  /* stack preview of mini covers under polaroid */
  .stack-preview{
    display:flex;
    justify-content:center;
    margin-top:6px;
    height:30px;
    position:relative;
  }
  .stack-cover{
    width:18px;height:26px;
    border-radius:2px;
    box-shadow:0 2px 5px rgba(63,46,30,.25), inset 0 0 0 1px rgba(255,255,255,.3);
    object-fit:cover;
    position:absolute;
    background:#ccc;
  }
  .stack-more{
    position:absolute;
    font-size:9px;
    color:var(--text-soft);
    background:rgba(247,244,239,.9);
    border-radius:999px;
    padding:2px 5px;
    bottom:-2px;
    box-shadow:0 1px 3px rgba(0,0,0,.1);
  }

  /* pin */
  .pin{
    position:absolute;
    top:-7px;left:50%;
    transform:translateX(-50%);
    width:13px;height:13px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--pin-shine), var(--pin) 60%, #5e251c 100%);
    box-shadow:0 2px 4px rgba(0,0,0,.35), 0 0 0 1px rgba(0,0,0,.05);
    z-index:6;
  }
  .pin.fav::after{
    content:'';
    position:absolute;
    top:-3px;left:-3px;right:-3px;bottom:-3px;
    border-radius:50%;
    border:1.5px solid var(--thread-fav);
    opacity:.85;
  }

  /* tape / decoration variants — applied via nth-child-ish data attr in JS */
  .deco{position:absolute;pointer-events:none;opacity:.85;}
  .deco-tape{
    width:36px;height:14px;
    background:rgba(255,255,255,.55);
    border:1px solid rgba(0,0,0,.03);
    box-shadow:0 1px 2px rgba(0,0,0,.08);
  }
  .deco-tape.washi{ background:repeating-linear-gradient(45deg, rgba(163,90,76,.25) 0 4px, rgba(244,233,214,.4) 4px 8px); }
  .deco-stain{
    width:20px;height:20px;border-radius:50%;
    background:radial-gradient(circle, rgba(120,90,50,.12), transparent 70%);
  }
  .deco-fold{
    width:14px;height:14px;
    background:linear-gradient(135deg, rgba(0,0,0,.06), transparent 60%);
    clip-path:polygon(100% 0, 0 0, 100% 100%);
  }
  .deco-num{
    font-size:9px;color:rgba(63,58,54,.35);
    font-family:'Courier New',monospace;
    transform:rotate(-4deg);
  }

  /* ---------- book node ---------- */
  .book-node{
    position:absolute;
    width:54px;
    will-change:transform;
    opacity:0;
    transform:scale(.4);
    transition:opacity .4s cubic-bezier(.2,.9,.3,1), transform .4s cubic-bezier(.2,.9,.3,1.4), filter .3s ease;
    cursor:pointer;
    z-index:4;
    pointer-events:none;
  }
  .book-node.visible{
    opacity:1;
    transform:scale(1);
    pointer-events:auto;
  }
  .book-node.dimmed{opacity:.14 !important;filter:saturate(.4);}
  .book-cover{
    width:100%;height:80px;
    border-radius:2px;
    object-fit:cover;
    background:#ccc;
    box-shadow:
      0 1px 0 rgba(255,255,255,.4) inset,
      0 6px 12px rgba(63,46,30,.22),
      0 1px 2px rgba(63,46,30,.15);
    transform:rotate(var(--rot,0deg));
    transition:transform .2s cubic-bezier(.2,.9,.3,1.3), box-shadow .2s ease;
    display:block;
    border:2px solid var(--paper);
  }
  .book-node:hover .book-cover,
  .book-node.focused .book-cover{
    transform:rotate(0deg) scale(1.15) translateY(-3px);
    box-shadow:
      0 1px 0 rgba(255,255,255,.4) inset,
      0 14px 26px rgba(63,46,30,.3),
      0 2px 4px rgba(63,46,30,.18);
  }
  .book-cover.status-unread{ filter:brightness(1.02); }
  .book-cover.status-read{ filter:sepia(.12) brightness(.97); }
  .book-cover.status-reading{ box-shadow:0 0 0 2px var(--accent), 0 6px 12px rgba(63,46,30,.22); }
  .book-pin{
    position:absolute;top:-5px;left:50%;transform:translateX(-50%);
    width:9px;height:9px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--pin-shine), var(--pin) 60%, #5e251c 100%);
    box-shadow:0 1px 3px rgba(0,0,0,.3);
    z-index:5;
  }

  /* ---------- detail card on click ---------- */
  .detail-card{
    position:fixed;
    bottom:22px;left:50%;
    transform:translateX(-50%) translateY(140%);
    width:min(420px, 92vw);
    background:var(--paper);
    border-radius:14px;
    padding:16px 18px;
    box-shadow:0 20px 50px rgba(63,46,30,.25), 0 2px 10px rgba(63,46,30,.1);
    z-index:60;
    transition:transform .35s cubic-bezier(.2,.9,.25,1.1);
    display:flex;gap:14px;align-items:center;
  }
  .detail-card.show{transform:translateX(-50%) translateY(0);}
  .detail-card img{width:46px;height:46px;border-radius:8px;object-fit:cover;}
  .detail-card .dc-title{font-size:13.5px;font-weight:600;}
  .detail-card .dc-sub{font-size:11.5px;color:var(--text-soft);margin-top:2px;}
  .detail-card .dc-close{
    margin-left:auto;width:26px;height:26px;border-radius:50%;
    background:rgba(63,58,54,.06);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:13px;color:var(--text-soft);
    flex-shrink:0;
  }

  /* ---------- zoom controls ---------- */
  .zoom-controls{
    position:fixed;right:18px;bottom:22px;
    display:flex;flex-direction:column;
    gap:1px;
    background:rgba(252,251,247,.9);
    backdrop-filter:blur(8px);
    border-radius:12px;
    box-shadow:0 6px 20px rgba(63,46,30,.15);
    overflow:hidden;
    z-index:50;
  }
  .zoom-btn{
    width:38px;height:36px;
    display:flex;align-items:center;justify-content:center;
    background:transparent;border:none;
    font-size:16px;color:var(--text);
    cursor:pointer;
  }
  .zoom-btn:hover{background:rgba(163,90,76,.08);}
  .zoom-btn:first-child{border-bottom:1px solid rgba(63,58,54,.08);}

  .hint{
    position:fixed;bottom:24px;left:20px;
    font-size:11px;color:var(--text-soft);
    background:rgba(252,251,247,.7);
    padding:6px 12px;border-radius:999px;
    backdrop-filter:blur(6px);
    z-index:50;
    pointer-events:none;
    transition:opacity .6s ease;
  }

  .loading-veil{
    position:fixed;inset:0;background:var(--bg);
    z-index:200;
    display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:10px;
    transition:opacity .6s ease;
  }
  .loading-veil .mark{font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--text);}
  .loading-veil .sub{font-size:11.5px;color:var(--text-soft);letter-spacing:.5px;}

  ::-webkit-scrollbar{display:none;}

  @media (max-width: 640px){
    .author-node{width:118px;}
    .topbar{padding:0 12px;height:56px;}
    .brand{font-size:18px;}
    .search-wrap{max-width:none;}
    .chip-btn span.label{display:none;}
  }
</style>
</head>
<body>

<div class="loading-veil" id="loadingVeil">
  <div class="mark">tsundoku</div>
  <div class="sub">unpinning the evidence wall…</div>
</div>

<div class="topbar">
  <div class="brand">tsundoku</div>
  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input class="search-input" id="searchInput" placeholder="find an author…" autocomplete="off">
  </div>
  <div class="topbar-right">
    <button class="chip-btn" id="collapseBtn"><span class="label">collapse all</span></button>
    <button class="chip-btn" id="gridToggleBtn"><span class="label">grid view</span></button>
  </div>
</div>

<div id="stage">
  <canvas id="threadCanvas"></canvas>
  <div id="world"></div>
</div>

<div class="zoom-controls">
  <button class="zoom-btn" id="zoomIn">+</button>
  <button class="zoom-btn" id="zoomOut">–</button>
</div>

<div class="hint" id="hint">scroll to zoom · drag to pan · tap an author to expand</div>

<div class="detail-card" id="detailCard">
  <img id="dcImg" src="" alt="">
  <div>
    <div class="dc-title" id="dcTitle"></div>
    <div class="dc-sub" id="dcSub"></div>
  </div>
  <div class="dc-close" id="dcClose">✕</div>
</div>

  function seededRandom(seed){
    let s = seed % 2147483647;
    if (s<=0) s += 2147483646;
    return function(){ s = (s*16807) % 2147483647; return (s-1)/2147483646; };
  }
  const rnd = seededRandom(1337);
  function randRange(a,b){ return a + rnd()*(b-a); }

  function generateMockData(){
    const authors = [];
    const books = [];
    let bookId = 0;

    REAL_DATA.forEach((entry, i)=>{
      const id = 'a'+i;
      const bookIds = [];
      entry.books.forEach(title=>{
        const bid = 'b'+(bookId++);
        const statusRoll = rnd();
        const status = statusRoll < 0.45 ? 'read' : statusRoll < 0.62 ? 'reading' : 'unread';
        books.push({
          id:bid,
          title,
          authorId:id,
          status,
          favorite: rnd() < 0.08,
          cover:`https://picsum.photos/seed/${bid}/200/300`
        });
        bookIds.push(bid);
      });
      authors.push({
        id, name: entry.name,
        portrait:`https://i.pravatar.cc/300?img=${(i%70)+1}`,
        bookIds
      });
    });
    return {authors, books};
  }

  // ---------------------------------------------------------------------
  // 2. LAYOUT — cluster authors using simple force-ish relaxation,
  //    books orbit their author when expanded.
  // ---------------------------------------------------------------------

  const WORLD = { w: 7200, h: 5200 };

  function layoutAuthors(authors){
    const cols = Math.ceil(Math.sqrt(authors.length * (WORLD.w/WORLD.h)));
    const rows = Math.ceil(authors.length / cols);
    const cellW = WORLD.w / cols;
    const cellH = WORLD.h / rows;

    authors.forEach((a, i)=>{
      const col = i % cols;
      const row = Math.floor(i / cols);
      const jitterX = randRange(-cellW*0.28, cellW*0.28);
      const jitterY = randRange(-cellH*0.28, cellH*0.28);
      a.x = col*cellW + cellW/2 + jitterX;
      a.y = row*cellH + cellH/2 + jitterY;
      a.rot = randRange(-4,4);
    });

    // light relaxation pass to reduce overlap
    for(let iter=0; iter<3; iter++){
      for(let i=0;i<authors.length;i++){
        for(let j=i+1;j<authors.length;j++){
          const A=authors[i], B=authors[j];
          const dx=B.x-A.x, dy=B.y-A.y;
          const dist=Math.hypot(dx,dy)||1;
          const minDist = 260;
          if(dist < minDist){
            const push = (minDist-dist)/2;
            const nx=dx/dist, ny=dy/dist;
            A.x -= nx*push; A.y -= ny*push;
            B.x += nx*push; B.y += ny*push;
          }
        }
      }
    }
  }

    pinchStartDist: 0,
    pinchStartScale: 1,
    focusedAuthorId: null,
    focusedBookId: null,
  };

  let DATA = generateMockData();
  layoutAuthors(DATA.authors);

  const authorById = new Map(DATA.authors.map(a=>[a.id,a]));
  const booksByAuthor = new Map();
  DATA.authors.forEach(a=>{
    booksByAuthor.set(a.id, DATA.books.filter(b=>b.authorId===a.id));
  });

  // ---------------------------------------------------------------------

  const authorNodeEls = new Map(); // id -> el

  function decorate(el, seedStr){
    // deterministic-ish decoration based on string hash
    let h = 0;
    for(let i=0;i<seedStr.length;i++) h = (h*31 + seedStr.charCodeAt(i)) >>> 0;
    const r = (n)=> (h = (h*1103515245+12345)>>>0, (h % n));

    if(r(3)===0){
      const tape = document.createElement('div');
      tape.className = 'deco deco-tape' + (r(2)===0 ? ' washi':'');
      tape.style.top = '-6px';
      tape.style.left = (10+r(60))+'%';
      tape.style.transform = `translateX(-50%) rotate(${-8+r(16)}deg)`;
      el.appendChild(tape);
    }
    if(r(4)===0){
      const stain = document.createElement('div');
      stain.className = 'deco deco-stain';
      stain.style.bottom = (4+r(10))+'px';
      stain.style.right = (4+r(14))+'px';
      el.appendChild(stain);
    }
    if(r(5)===0){
      const fold = document.createElement('div');
      fold.className = 'deco deco-fold';
      fold.style.top='0';fold.style.right='0';
      el.appendChild(fold);
    }
    if(r(6)===0){
      const num = document.createElement('div');
      num.className = 'deco deco-num';
      num.style.bottom='-13px'; num.style.left='2px';
      num.textContent = '#'+(100+r(900));
      el.appendChild(num);
    }
  }

  function buildAuthorNode(a){

      more.textContent = '+'+(booksByAuthor.get(a.id).length-3);

  DATA.authors.forEach(buildAuthorNode);

  // ---------------------------------------------------------------------
  // 6. EXPAND / COLLAPSE BOOKS
  // ---------------------------------------------------------------------

  function orbitPositions(n, radius){
    const pts = [];
    for(let i=0;i<n;i++){
      const angle = (i/n) * Math.PI*2 - Math.PI/2;
      const jitter = randRange(-14,14);
      pts.push({
        x: Math.cos(angle)*(radius+jitter),
        y: Math.sin(angle)*(radius+jitter)
      });
    }
    return pts;
  }

  function buildBookNode(b, x, y, rot){
    const el = document.createElement('div');
    el.className = 'book-node';
    el.dataset.id = b.id;
    el.dataset.author = b.authorId;
    el.style.left = x+'px';
    el.style.top = y+'px';
    el.style.setProperty('--rot', rot+'deg');
    el.innerHTML = `
      <div class="book-pin"></div>
      <img class="book-cover status-${b.status}" loading="lazy" src="${b.cover}" alt="${b.title}">
    `;
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      showDetail(b);
    });
    world.appendChild(el);
    bookNodeEls.set(b.id, el);
    requestAnimationFrame(()=> el.classList.add('visible'));
  }

  function expandAuthor(id){
    if(state.expanded.has(id)) return;
    const a = authorById.get(id);
    const abooks = booksByAuthor.get(id);
    const radius = 110 + Math.min(abooks.length*9, 90);
    const pts = orbitPositions(abooks.length, radius);
    abooks.forEach((b,i)=>{
      const px = a.x + 74 + pts[i].x; // offset to author center (node width ~148)
      const py = a.y + 90 + pts[i].y;
      buildBookNode(b, px, py, randRange(-10,10));
    });
    state.expanded.add(id);
    drawThreads();
  }

  function collapseAuthor(id){
    const abooks = booksByAuthor.get(id);
    abooks.forEach(b=>{
      const el = bookNodeEls.get(b.id);
      if(el){
        el.classList.remove('visible');
        setTimeout(()=>{ el.remove(); bookNodeEls.delete(b.id); }, 350);
      }
    });
    state.expanded.delete(id);
    requestAnimationFrame(drawThreads);
  }

  function toggleExpand(id){
    if(state.expanded.has(id)){
      collapseAuthor(id);
    } else {
      // keep at most 2 expanded for readability
      if(state.expanded.size >= 2){
        const oldest = state.expanded.values().next().value;
        collapseAuthor(oldest);
      }
      expandAuthor(id);
    }
  }

  collapseBtn.addEventListener('click', ()=>{
    Array.from(state.expanded).forEach(collapseAuthor);
  });

  // ---------------------------------------------------------------------
  // 7. THREADS (canvas overlay, world-space -> screen-space)
  // ---------------------------------------------------------------------

  function worldToScreen(x,y){
    return {
      x: x*state.scale + state.tx,
      y: y*state.scale + state.ty
    };
  }

  function drawThread(p1, p2, highlight){
    const dx = p2.x-p1.x, dy = p2.y-p1.y;
    const dist = Math.hypot(dx,dy);
    const sag = Math.min(dist*0.12, 26) * (1 + Math.sin((p1.x+p2.x)*0.01)*0.15);
    const mx = (p1.x+p2.x)/2 + dy*0.04;
    const my = (p1.y+p2.y)/2 - dx*0.04 + sag;

    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.quadraticCurveTo(mx, my, p2.x, p2.y);
    ctx.lineWidth = highlight ? 1.6 : 1.1;
    ctx.strokeStyle = highlight
      ? 'rgba(163,90,76,0.75)'
      : 'rgba(201,179,154,0.55)';
    ctx.shadowColor = 'rgba(63,46,30,0.18)';
    ctx.shadowBlur = highlight ? 3 : 1.5;
    ctx.shadowOffsetY = 1;
    ctx.stroke();
  }

  function drawThreads(){
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    ctx.clearRect(0,0,window.innerWidth, window.innerHeight);

    state.expanded.forEach(id=>{
      const a = authorById.get(id);
      const anchor = worldToScreen(a.x+74, a.y+58);
      const abooks = booksByAuthor.get(id);
      const highlight = id === state.focusedAuthorId;
      abooks.forEach(b=>{
        const el = bookNodeEls.get(b.id);
        if(!el) return;
        const bx = parseFloat(el.style.left) + 27;
        const by = parseFloat(el.style.top) + 6;
        const p2 = worldToScreen(bx,by);
        drawThread(anchor, p2, highlight);
      });
    });
  }

  // ---------------------------------------------------------------------
  // 8. TRANSFORM / PAN / ZOOM (pointer events, works for mouse+touch+trackpad)
  // ---------------------------------------------------------------------

  function applyTransform(){
    world.style.transform = `translate3d(${state.tx}px, ${state.ty}px, 0) scale(${state.scale})`;
    drawThreads();
  }

  function centerOn(wx, wy, targetScale){
    const s = targetScale != null ? targetScale : state.scale;
    state.scale = s;
    state.tx = window.innerWidth/2 - wx*s;
    state.ty = window.innerHeight/2 - wy*s;
    applyTransform();
  }

  // initial center
  centerOn(WORLD.w/2, WORLD.h/2, 0.42);

  stage.addEventListener('pointerdown', (e)=>{
    state.pointers.set(e.pointerId, {x:e.clientX,y:e.clientY});
    if(state.pointers.size === 1){
      state.dragging = true;
      state.lastX = e.clientX;
      state.lastY = e.clientY;
      stage.classList.add('dragging');
    }
  });

  stage.addEventListener('pointermove', (e)=>{
    if(!state.pointers.has(e.pointerId)) return;
    state.pointers.set(e.pointerId, {x:e.clientX,y:e.clientY});

    if(state.pointers.size === 2){
      const pts = Array.from(state.pointers.values());
      const dist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      if(!state.pinchStartDist){
        state.pinchStartDist = dist;
        state.pinchStartScale = state.scale;
      } else {
        const factor = dist/state.pinchStartDist;
        const newScale = Math.min(2.2, Math.max(0.12, state.pinchStartScale*factor));
        const cx = (pts[0].x+pts[1].x)/2, cy=(pts[0].y+pts[1].y)/2;
        zoomAt(cx, cy, newScale);
      }
      return;
    }

    if(state.dragging){
      const dx = e.clientX - state.lastX;
      const dy = e.clientY - state.lastY;
      state.tx += dx;
      state.ty += dy;
      state.lastX = e.clientX;
      state.lastY = e.clientY;
      applyTransform();
    }
  });

  function endPointer(e){
    state.pointers.delete(e.pointerId);
    if(state.pointers.size < 2){
      state.pinchStartDist = 0;
    }
    if(state.pointers.size === 0){
      state.dragging = false;
      stage.classList.remove('dragging');
    }
  }
  stage.addEventListener('pointerup', endPointer);
  stage.addEventListener('pointercancel', endPointer);
  stage.addEventListener('pointerleave', endPointer);

  function zoomAt(screenX, screenY, newScale){
    const wx = (screenX - state.tx) / state.scale;
    const wy = (screenY - state.ty) / state.scale;
    state.scale = newScale;
    state.tx = screenX - wx*state.scale;
    state.ty = screenY - wy*state.scale;
    applyTransform();
  }

  stage.addEventListener('wheel', (e)=>{
    e.preventDefault();
    const delta = -e.deltaY * 0.0014;
    const newScale = Math.min(2.2, Math.max(0.12, state.scale * (1+delta)));
    zoomAt(e.clientX, e.clientY, newScale);
  }, {passive:false});

  document.getElementById('zoomIn').addEventListener('click', ()=>{
    zoomAt(window.innerWidth/2, window.innerHeight/2, Math.min(2.2, state.scale*1.25));
  });
  document.getElementById('zoomOut').addEventListener('click', ()=>{
    zoomAt(window.innerWidth/2, window.innerHeight/2, Math.max(0.12, state.scale*0.8));
  });

  stage.addEventListener('click', ()=>{
    // clicked empty board — clear focus
    setFocus(null,null);
  });

  // ---------------------------------------------------------------------
  // 9. HOVER / FOCUS DIMMING
  // ---------------------------------------------------------------------

  function setFocus(authorId, bookId){
    state.focusedAuthorId = authorId;
    state.focusedBookId = bookId;

    authorNodeEls.forEach((el,id)=>{
      const related = !authorId || id===authorId || (bookId && el.dataset.id === (authorById.get(id)? bookId:null));
      if(!authorId && !bookId){
        el.classList.remove('dimmed','focused');
        return;
      }
      const isMatch = id === authorId || (bookId && bookNodeEls.has(bookId) && bookNodeEls.get(bookId).dataset.author===id);
      el.classList.toggle('dimmed', !isMatch);
      el.classList.toggle('focused', isMatch);
    });

    bookNodeEls.forEach((el,id)=>{
      if(!authorId && !bookId){
        el.classList.remove('dimmed','focused');
        return;
      }
      const isMatch = (bookId && id===bookId) || (authorId && el.dataset.author===authorId && !bookId);
      el.classList.toggle('dimmed', !isMatch);
      el.classList.toggle('focused', bookId===id);
    });

    drawThreads();
  }

  world.addEventListener('mouseover', (e)=>{
    const aNode = e.target.closest('.author-node');
    const bNode = e.target.closest('.book-node');
    if(bNode){
      setFocus(bNode.dataset.author, bNode.dataset.id);
    } else if(aNode){
      setFocus(aNode.dataset.id, null);
    }
  });
  world.addEventListener('mouseout', (e)=>{
    if(!e.relatedTarget || !world.contains(e.relatedTarget)){
      setFocus(null,null);
    }
  });

  // ---------------------------------------------------------------------
  // 10. SEARCH — cinematic pan/zoom to match
  // ---------------------------------------------------------------------

  let searchDebounce;
  searchInput.addEventListener('input', ()=>{
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(runSearch, 200);
  });

  function runSearch(){
    const q = searchInput.value.trim().toLowerCase();
    if(!q){ setFocus(null,null); return; }
    const match = DATA.authors.find(a=> a.name.toLowerCase().includes(q));
    if(!match) return;

    setFocus(match.id, null);
    expandAuthor(match.id);
    centerOn(match.x+74, match.y+90, 0.85);
  }

  // ---------------------------------------------------------------------
  // 11. DETAIL CARD
  // ---------------------------------------------------------------------

  function showDetail(book){
    const author = authorById.get(book.authorId);
    dcImg.src = book.cover;
    dcTitle.textContent = book.title;
    dcSub.textContent = `${author.name} · ${book.status}`;
    detailCard.classList.add('show');
  }
  dcClose.addEventListener('click', ()=> detailCard.classList.remove('show'));

  // ---------------------------------------------------------------------
  // 12. INIT
  // ---------------------------------------------------------------------

  applyTransform();
  setTimeout(()=>{
    loadingVeil.style.opacity = '0';
    setTimeout(()=> loadingVeil.style.display='none', 650);
  }, 500);
  setTimeout(()=>{ hint.style.opacity = '0'; }, 5000);

})();
</script>
