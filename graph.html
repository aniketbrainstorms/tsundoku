const wrap = document.getElementById('graph-wrap');
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');
const searchEl = document.getElementById('search');

let W, H;
let nodes = [], edges = [];
let transform = { x: 0, y: 0, scale: 1 };
let dragging = false, lastMouse = null;
let hoveredNode = null;
let highlightSet = null;
let animFrame;

function resize() {
  W = wrap.clientWidth;
  H = wrap.clientHeight;
  canvas.width = W;
  canvas.height = H;
}

function buildGraph() {
  nodes = [];
  edges = [];
  const cx = 0, cy = 0;

  RAW.forEach(([author, books], ai) => {
    const angle = (ai / RAW.length) * Math.PI * 2;
    const r = 280 + Math.random() * 180;
    const ax = cx + Math.cos(angle) * r;
    const ay = cy + Math.sin(angle) * r;
    const authorNode = { id: `a${ai}`, label: author, x: ax, y: ay, vx: 0, vy: 0, type: 'author', books: books.length, bookCount: books.length };
    nodes.push(authorNode);

    books.forEach((book, bi) => {
      const bangle = angle + (bi - (books.length - 1) / 2) * (0.18 / Math.max(books.length, 1));
      const br = r + 80 + Math.random() * 40;
      const bx = cx + Math.cos(bangle) * br;
      const by = cy + Math.sin(bangle) * br;
      const bookNode = { id: `b${ai}_${bi}`, label: book, x: bx, y: by, vx: 0, vy: 0, type: 'book', authorId: `a${ai}` };
      nodes.push(bookNode);
      edges.push({ source: authorNode.id, target: bookNode.id });
    });
  });
}

const nodeMap = () => {
  const m = {};
  nodes.forEach(n => m[n.id] = n);
  return m;
};

let nm = {};

function simulate(steps) {
  nm = nodeMap();
  for (let s = 0; s < steps; s++) {
    nodes.forEach(n => { n.vx = 0; n.vy = 0; });

    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        let dx = b.x - a.x, dy = b.y - a.y;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
        const sameAuthor = a.authorId && b.authorId && a.authorId === b.authorId;
        const minDist = sameAuthor ? 35 : (a.type === 'author' && b.type === 'author' ? 90 : 50);
        if (dist < minDist) {
          const force = (minDist - dist) / dist * 0.15;
          a.vx -= dx * force; a.vy -= dy * force;
          b.vx += dx * force; b.vy += dy * force;
        }
      }
    }

    edges.forEach(e => {
      const a = nm[e.source], b = nm[e.target];
      if (!a || !b) return;
      let dx = b.x - a.x, dy = b.y - a.y;
      const dist = Math.sqrt(dx * dx + dy * dy) || 1;
      const ideal = 90;
      const force = (dist - ideal) / dist * 0.08;
      a.vx += dx * force; a.vy += dy * force;
      b.vx -= dx * force; b.vy -= dy * force;
    });

    nodes.forEach(n => {
      const cr = Math.sqrt(n.x * n.x + n.y * n.y);
      if (cr > 1) {
        n.vx -= (n.x / cr) * 0.001;
        n.vy -= (n.y / cr) * 0.001;
      }
      n.x += n.vx; n.y += n.vy;
    });
  }
  nm = nodeMap();
}

function toScreen(wx, wy) {
  return { x: wx * transform.scale + W / 2 + transform.x, y: wy * transform.scale + H / 2 + transform.y };
}
function toWorld(sx, sy) {
  return { x: (sx - W / 2 - transform.x) / transform.scale, y: (sy - H / 2 - transform.y) / transform.scale };
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0d0f0e';
  ctx.fillRect(0, 0, W, H);

  const query = searchEl.value.toLowerCase().trim();
  let focusSet = null;
  if (query) {
    focusSet = new Set();
    nodes.forEach(n => {
      if (n.type === 'author' && n.label.toLowerCase().includes(query)) {
        focusSet.add(n.id);
        edges.forEach(e => { if (e.source === n.id) focusSet.add(e.target); });
      }
    });
  }
  if (highlightSet) focusSet = highlightSet;

  edges.forEach(e => {
    const a = nm[e.source], b = nm[e.target];
    if (!a || !b) return;
    const sa = toScreen(a.x, a.y), sb = toScreen(b.x, b.y);
    const dimmed = focusSet && !focusSet.has(a.id);
    ctx.beginPath();
    ctx.moveTo(sa.x, sa.y);
    ctx.lineTo(sb.x, sb.y);
    ctx.strokeStyle = dimmed ? 'rgba(80,70,60,0.12)' : 'rgba(120,100,80,0.25)';
    ctx.lineWidth = 0.8;
    ctx.stroke();
  });

  nodes.forEach(n => {
    const s = toScreen(n.x, n.y);
    const dimmed = focusSet && !focusSet.has(n.id);
    const hovered = hoveredNode && hoveredNode.id === n.id;

    if (n.type === 'author') {
      const r = Math.max(4, Math.min(9, 4 + n.bookCount * 0.35));
      ctx.beginPath();
      ctx.arc(s.x, s.y, r + (hovered ? 2 : 0), 0, Math.PI * 2);
      ctx.fillStyle = dimmed ? 'rgba(100,80,60,0.25)' : (hovered ? '#e88a5a' : '#c9714a');
      ctx.fill();
      if (!dimmed && transform.scale > 0.7) {
        ctx.fillStyle = hovered ? 'rgba(240,235,227,0.95)' : 'rgba(200,180,160,0.7)';
        ctx.font = `${Math.round(10 * Math.min(transform.scale, 1.2))}px DM Sans, sans-serif`;
        ctx.textAlign = 'center';
        const maxW = n.label.length > 16 ? n.label.substring(0, 14) + '…' : n.label;
        ctx.fillText(maxW, s.x, s.y - r - 4);
      }
    } else {
      ctx.beginPath();
      ctx.arc(s.x, s.y, hovered ? 3.5 : 2.5, 0, Math.PI * 2);
      ctx.fillStyle = dimmed ? 'rgba(60,90,70,0.2)' : (hovered ? '#7ab' : '#4a7060');
      ctx.fill();
    }
  });
}

function findNodeAt(sx, sy) {
  const w = toWorld(sx, sy);
  let best = null, bestDist = 16 / transform.scale;
  nodes.forEach(n => {
    const dx = n.x - w.x, dy = n.y - w.y;
    const d = Math.sqrt(dx * dx + dy * dy);
    if (d < bestDist) { bestDist = d; best = n; }
  });
  return best;
}

canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  const sx = e.clientX - r.left, sy = e.clientY - r.top;

  if (dragging && lastMouse) {
    transform.x += sx - lastMouse.x;
    transform.y += sy - lastMouse.y;
    lastMouse = { x: sx, y: sy };
    draw();
    return;
  }

  const n = findNodeAt(sx, sy);
  hoveredNode = n;
  if (n) {
    canvas.style.cursor = 'pointer';
    tooltip.style.display = 'block';
    tooltip.style.left = (sx + 14) + 'px';
    tooltip.style.top = (sy - 10) + 'px';
    if (n.type === 'author') {
      const books = RAW.find(([a]) => a === n.label)?.[1] || [];
      tooltip.innerHTML = `<div class="author">${n.label}</div><div class="count">${books.length} book${books.length !== 1 ? 's' : ''}</div>`;
    } else {
      const author = nm[n.authorId];
      tooltip.innerHTML = `<div style="color:#f0ebe3;font-size:12px;">${n.label}</div><div class="count">${author ? author.label : ''}</div>`;
    }
    highlightSet = new Set([n.id]);
    if (n.type === 'author') {
      edges.forEach(e => { if (e.source === n.id) highlightSet.add(e.target); });
    } else {
      highlightSet.add(n.authorId);
    }
  } else {
    canvas.style.cursor = 'grab';
    tooltip.style.display = 'none';
    highlightSet = null;
  }
  draw();
});

canvas.addEventListener('mousedown', e => {
  dragging = true;
  const r = canvas.getBoundingClientRect();
  lastMouse = { x: e.clientX - r.left, y: e.clientY - r.top };
  canvas.style.cursor = 'grabbing';
});
canvas.addEventListener('mouseup', () => { dragging = false; canvas.style.cursor = hoveredNode ? 'pointer' : 'grab'; });
canvas.addEventListener('mouseleave', () => { dragging = false; tooltip.style.display = 'none'; });

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const factor = e.deltaY > 0 ? 0.9 : 1.1;
  transform.x = mx - (mx - transform.x) * factor;
  transform.y = my - (my - transform.y) * factor;
  transform.scale = Math.max(0.15, Math.min(4, transform.scale * factor));
  draw();
}, { passive: false });

document.getElementById('btn-reset').addEventListener('click', () => {
  transform = { x: 0, y: 0, scale: 1 };
  draw();
});
document.getElementById('btn-zoom-in').addEventListener('click', () => {
  transform.scale = Math.min(4, transform.scale * 1.3); draw();
});
document.getElementById('btn-zoom-out').addEventListener('click', () => {
  transform.scale = Math.max(0.15, transform.scale / 1.3); draw();
});
searchEl.addEventListener('input', draw);

resize();
buildGraph();
simulate(120);
nm = nodeMap();
draw();
window.addEventListener('resize', () => { resize(); draw(); });
</script>
