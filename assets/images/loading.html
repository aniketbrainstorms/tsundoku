<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Book Loader</title>
<style>
  :root {
    --bg: #000000;
    --ground: #6b5b4d;
    --dust: #cdbba4;
    --book-1: #c8553d; /* terracotta */
    --book-2: #d9a441; /* mustard */
    --book-3: #4f8a7b; /* sage teal */
    --cycle: 4.4s;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body {
    min-height: 100dvh;
    display: grid;
    place-items: center;
    background: var(--bg);
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- Layout + text ---------- */
  .loader-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
    text-align: center;
    font-family: "Bristol", Georgia, serif;
  }
  .loader-title {
    margin: 0;
    font-weight: normal;
    font-size: clamp(40px, 12vw, 56px);
    line-height: 1;
    color: #e8dfd0;
    text-align: left;
    animation: rise-in .9s cubic-bezier(.2,.7,.3,1) both;
  }
  .loader-by {
    display: block;
    margin-top: .06em;
    margin-left: 76%;
    font-size: .34em;
    line-height: 1;
    white-space: nowrap;
    color: #cdbba4;
    animation: rise-in .9s .5s cubic-bezier(.2,.7,.3,1) both;
  }
  @keyframes rise-in {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .loader-tagline {
    margin: 0;
    font-size: 16px;
    line-height: 1.35;
    color: #a39380;
  }

  /* ---------- Loader ---------- */
  .book-loader {
    width: 160px;
    height: 140px;
    color: var(--dust);
  }
  .book-loader svg { width: 100%; height: 100%; overflow: visible; display: block; }

  .ground { stroke: var(--ground); stroke-width: 2; stroke-linecap: round; }

  .book {
    opacity: 0;
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: var(--cycle) infinite;
    will-change: transform, opacity;
  }
  .book-1 { animation-name: drop-1; }
  .book-2 { animation-name: drop-2; }
  .book-3 { animation-name: drop-3; }

  .dust {
    fill: currentColor;
    opacity: 0;
    animation: dust var(--cycle) cubic-bezier(.2,.7,.3,1) infinite;
  }

  /* Each book: hidden above -> falls -> lands + squash -> holds -> fades out */
  @keyframes drop-1 {
    0%  { opacity: 0; transform: translateY(-80px) rotate(-5deg) scale(1,1); animation-timing-function: linear; }
    2%  { opacity: 0; transform: translateY(-80px) rotate(-5deg) scale(1,1); animation-timing-function: linear; }
    2.5% { opacity: 1; transform: translateY(-80px) rotate(-5deg) scale(1,1); animation-timing-function: cubic-bezier(.5,0,.9,.55); }
    14% { opacity: 1; transform: translateY(0) rotate(0) scale(1,1); animation-timing-function: ease-out; }
    17% { opacity: 1; transform: translateY(0) rotate(0) scale(1.05,.86); animation-timing-function: ease-out; }
    21% { opacity: 1; transform: translateY(0) rotate(0) scale(1,1); }
    88% { opacity: 1; transform: translateY(0) rotate(0) scale(1,1); }
    96%,100% { opacity: 0; transform: translateY(0) rotate(0) scale(1,1); }
  }
  @keyframes drop-2 {
    0%  { opacity: 0; transform: translateY(-80px) rotate(4deg) scale(1,1); animation-timing-function: linear; }
    24% { opacity: 0; transform: translateY(-80px) rotate(4deg) scale(1,1); animation-timing-function: linear; }
    24.5% { opacity: 1; transform: translateY(-80px) rotate(4deg) scale(1,1); animation-timing-function: cubic-bezier(.5,0,.9,.55); }
    36% { opacity: 1; transform: translateY(0) rotate(0) scale(1,1); animation-timing-function: ease-out; }
    39% { opacity: 1; transform: translateY(0) rotate(0) scale(1.05,.86); animation-timing-function: ease-out; }
    43% { opacity: 1; transform: translateY(0) rotate(0) scale(1,1); }
    88% { opacity: 1; transform: translateY(0) rotate(0) scale(1,1); }
    96%,100% { opacity: 0; transform: translateY(0) rotate(0) scale(1,1); }
  }
  @keyframes drop-3 {
    0%  { opacity: 0; transform: translateY(-80px) rotate(-3deg) scale(1,1); animation-timing-function: linear; }
    46% { opacity: 0; transform: translateY(-80px) rotate(-3deg) scale(1,1); animation-timing-function: linear; }
    46.5% { opacity: 1; transform: translateY(-80px) rotate(-3deg) scale(1,1); animation-timing-function: cubic-bezier(.5,0,.9,.55); }
    58% { opacity: 1; transform: translateY(0) rotate(0) scale(1,1); animation-timing-function: ease-out; }
    61% { opacity: 1; transform: translateY(0) rotate(0) scale(1.05,.86); animation-timing-function: ease-out; }
    65% { opacity: 1; transform: translateY(0) rotate(0) scale(1,1); }
    88% { opacity: 1; transform: translateY(0) rotate(0) scale(1,1); }
    96%,100% { opacity: 0; transform: translateY(0) rotate(0) scale(1,1); }
  }

  /* Dust specks puff outward on impact (delay = moment of landing) */
  @keyframes dust {
    0%   { opacity: .85; transform: translate(0,0) scale(1); }
    14%  { opacity: 0;   transform: translate(var(--dx), var(--dy)) scale(.3); }
    100% { opacity: 0;   transform: translate(var(--dx), var(--dy)) scale(.3); }
  }

  /* Respect reduced motion: show a calm static stack */
  @media (prefers-reduced-motion: reduce) {
    .loader-title, .loader-by { animation: none; }
    .book { animation: none; opacity: 1; }
    .dust { animation: none; opacity: 0; }
  }
</style>
